[project]
name = "atlassian-mcp-agent"
version = "0.1.0"
description = "Single-user Google ADK agent calling the Atlassian Rovo Remote MCP Server via OAuth 2.1 + DCR + PKCE. Claude Sonnet 4.6 on AWS Bedrock via LiteLLM. (Phase 1)"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # ADK 2.0 GA added the StreamableHTTPConnectionParams.httpx_client_factory seam (v1.22.0).
    "google-adk>=2.0",
    # ADK 2.1 dropped the `[litellm]` extra, so bring litellm explicitly for the LiteLlm
    # wrapper. >=1.83.7 parses Bedrock cross-region inference-profile ids (us.anthropic...).
    "litellm>=1.83.7",
    # The <2 cap is load-bearing: mcp 2.x changes the streamable-http client API that ADK's
    # httpx_client_factory plumbing depends on. See scratchpad/02-research-mcp-sdk.md.
    "mcp>=1.24,<2",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.13",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# Treat this repo as an application, not a distributable package: uv installs deps but does
# not try to build/install the project itself. `adk web/run/api_server` import the
# atlassian_mcp_agent package directly from the repo root.
[tool.uv]
package = false

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["atlassian_mcp_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
# reference_data/ is read-only reference material; _smoke.py is a scratch import check.
extend-exclude = ["reference_data", "_smoke.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Repo root on sys.path so tests import the (non-installed) atlassian_mcp_agent package.
pythonpath = ["."]
